services:
  - type: web
    name: deepcanvas
    runtime: docker
    plan: starter
    dockerfilePath: ./docker/Dockerfile.render
    dockerContext: .
    healthCheckPath: /health
    disk:
      name: deepcanvas-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: HOME
        value: /var/data
      - key: WEB_HOST
        value: 127.0.0.1
      - key: WEB_PORT
        value: "19000"
      - key: WEB_PATH
        value: /ws
      - key: LOG_LEVEL
        value: INFO
      - key: DEEPCANVAS_REQUIRE_WEB_AUTH
        value: "true"
      - key: DEEPCANVAS_ALLOW_SIGNUPS
        value: "true"
      - key: PLUNK_AUTOSTART
        value: "false"
      - key: UPLOAD_POST_API_KEY
        sync: false
