services:
  plunk-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: plunk
      POSTGRES_USER: plunk
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - plunk_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plunk"]
      interval: 10s
      timeout: 5s
      retries: 5

  plunk-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - plunk_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  plunk-minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-plunk}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - plunk_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  plunk-ntfy:
    image: binwiederhier/ntfy:latest
    restart: unless-stopped
    command: serve
    volumes:
      - plunk_ntfy_cache:/var/cache/ntfy
      - plunk_ntfy_etc:/etc/ntfy

  plunk:
    image: ghcr.io/useplunk/plunk:latest
    restart: unless-stopped
    depends_on:
      plunk-postgres:
        condition: service_healthy
      plunk-redis:
        condition: service_healthy
      plunk-minio:
        condition: service_healthy
    environment:
      SERVICE: all
      NODE_ENV: production
      DATABASE_URL: postgresql://plunk:${DB_PASSWORD}@plunk-postgres:5432/plunk
      DIRECT_DATABASE_URL: postgresql://plunk:${DB_PASSWORD}@plunk-postgres:5432/plunk
      REDIS_URL: redis://plunk-redis:6379
      JWT_SECRET: ${JWT_SECRET}
      API_DOMAIN: ${API_DOMAIN}
      DASHBOARD_DOMAIN: ${DASHBOARD_DOMAIN}
      LANDING_DOMAIN: ${LANDING_DOMAIN}
      WIKI_DOMAIN: ${WIKI_DOMAIN}
      SMTP_DOMAIN: ${SMTP_DOMAIN}
      USE_HTTPS: ${USE_HTTPS:-true}
      AWS_SES_REGION: ${AWS_SES_REGION}
      AWS_SES_ACCESS_KEY_ID: ${AWS_SES_ACCESS_KEY_ID}
      AWS_SES_SECRET_ACCESS_KEY: ${AWS_SES_SECRET_ACCESS_KEY}
      SES_CONFIGURATION_SET: ${SES_CONFIGURATION_SET:-plunk-tracking}
      S3_ENDPOINT: http://plunk-minio:9000
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-plunk}
      S3_ACCESS_KEY_SECRET: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-uploads}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
      S3_FORCE_PATH_STYLE: "true"
      NTFY_URL: http://plunk-ntfy/plunk-notifications
      DISABLE_SIGNUPS: ${DISABLE_SIGNUPS:-true}
      VERIFY_EMAIL_ON_SIGNUP: ${VERIFY_EMAIL_ON_SIGNUP:-true}
      AUTO_PROJECT_DISABLE: ${AUTO_PROJECT_DISABLE:-false}
      EMAIL_RATE_LIMIT_PER_SECOND: ${EMAIL_RATE_LIMIT_PER_SECOND:-1}
    ports:
      - "${PLUNK_HTTP_PORT:-8088}:80"
      - "${PLUNK_SMTPS_PORT:-465}:465"
      - "${PLUNK_SMTP_PORT:-587}:587"
    volumes:
      - plunk_app_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  plunk_postgres_data:
  plunk_redis_data:
  plunk_minio_data:
  plunk_ntfy_cache:
  plunk_ntfy_etc:
  plunk_app_data:
