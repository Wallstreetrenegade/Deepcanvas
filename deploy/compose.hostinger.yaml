services:
  deepcanvas:
    build:
      context: ../app
      dockerfile: docker/Dockerfile.render
    image: deepcanvas:hostinger
    container_name: deepcanvas
    restart: unless-stopped
    ports:
      - "127.0.0.1:10000:10000"
    environment:
      PORT: "10000"
      HOME: /var/data
      WEB_HOST: 127.0.0.1
      WEB_PORT: "19000"
      WEB_PATH: /ws
      LOG_LEVEL: INFO
      DEEPCANVAS_REQUIRE_WEB_AUTH: "true"
      DEEPCANVAS_ALLOW_SIGNUPS: "true"
      ALLOWED_WS_ORIGIN_HOSTS: deepcanvas.app,www.deepcanvas.app,deepcanvas.168-231-68-253.sslip.io
      PLUNK_AUTOSTART: "false"
      OPEN_DESIGN_DAEMON_AUTOSTART: "true"
    volumes:
      - /var/lib/deepcanvas:/var/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:10000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  caddy:
    image: caddy:2.10.2-alpine
    container_name: deepcanvas-caddy
    restart: unless-stopped
    depends_on:
      deepcanvas:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
